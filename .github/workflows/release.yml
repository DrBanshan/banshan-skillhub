name: Release Obsidian plugin

# Fires when you push a tag whose name matches the version in manifest.json,
# e.g. `git tag -a 1.0.1 -m "1.0.1" && git push origin 1.0.1`
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runsOn: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          nodeVersion: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      # Signed SLSA build-provenance attestation for the release assets
      # (recommended when submitting the plugin to the community directory).
      # Remove styles.css below if the plugin ever stops shipping a stylesheet.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
