name: Release Obsidian plugin

# The documented release workflow from the official obsidian-workflows action, the same shape the
# action's own release.yml uses: build, attest the artifacts, and open a draft release that you
# publish by hand from the Releases page. Release mode refuses to run unless the ref is a tag, so
# the tag trigger below is load bearing rather than cosmetic.
#
# GITHUB_TOKEN is provided automatically by the workflow and needs no secret configured.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate, build, attest and draft the release
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: release
          scanner-lint: "true"
          lint: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
